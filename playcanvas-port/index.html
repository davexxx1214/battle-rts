<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111512" />
    <title>Ironfield RTS · PlayCanvas Port</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="application" aria-label="PlayCanvas 战场"></canvas>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">⚔</span>
          <div><small>PLAYCANVAS FIELD TEST</small><strong>IRONFIELD <em>GOLD WAR</em></strong></div>
        </div>
        <nav class="mode-switch" aria-label="游戏模式">
          <button type="button" data-mode="normal" data-active="true">普通模式</button>
          <button type="button" data-mode="arena">竞技场</button>
        </nav>
        <div class="battle-state"><span id="battle-label">等待交战</span><strong id="clock">05:00</strong></div>
        <div id="asset-progress" class="asset-progress" role="status" aria-live="polite">
          <span>载入美术资源</span><strong>0%</strong>
        </div>
        <div class="top-actions">
          <label>AI
            <select id="difficulty" aria-label="AI 难度">
              <option value="easy">简单</option>
              <option value="normal" selected>普通</option>
              <option value="hard">困难</option>
            </select>
          </label>
          <button id="audio-toggle" type="button" aria-pressed="true">音频：开</button>
          <button id="reset" type="button">重新开局</button>
        </div>
      </header>

      <aside class="deploy-rail" id="deploy-rail" aria-label="部署单位和建筑">
        <section class="gold-card">
          <small>WAR CHEST</small>
          <div><span>金币储备</span><strong id="gold">500</strong></div>
          <div class="gold-track"><i id="gold-fill"></i></div>
          <p id="gold-status">恢复中</p>
        </section>
        <section>
          <h2>作战单位</h2>
          <div id="troop-cards" class="card-list"></div>
        </section>
        <section>
          <h2>战场建筑</h2>
          <div id="building-cards" class="card-list"></div>
        </section>
        <p class="rail-help">选择卡牌后点击蓝色势力范围部署</p>
      </aside>

      <aside class="enemy-panel">
        <small>ENEMY HOST</small>
        <strong id="enemy-count">0</strong>
        <span>猩红军团存活</span>
      </aside>

      <section class="castle-bars" aria-label="城堡生命">
        <div><span>苍蓝城堡</span><i><b id="verdant-castle"></b></i><strong id="verdant-castle-label">2000</strong></div>
        <div><span>猩红城堡</span><i><b id="crimson-castle"></b></i><strong id="crimson-castle-label">2000</strong></div>
      </section>

      <div class="camera-help">中键/左键拖动平移 · 滚轮缩放 · Q/E 旋转</div>
      <div id="feedback" class="feedback" aria-live="polite"></div>

      <section id="briefing" class="modal open" aria-label="开始战斗">
        <div class="modal-card">
          <small>FORTIFIED FRONT</small>
          <h1>PlayCanvas 移植原型</h1>
          <p>战斗规则、经济系统与敌方 AI 沿用原版；场景、镜头、拾取、单位和特效已切换到 PlayCanvas Engine。</p>
          <button id="engage" type="button">⚔ 开始交战</button>
        </div>
      </section>

      <section id="result" class="modal" aria-live="assertive">
        <div class="modal-card result-card">
          <small>THE FIELD IS DECIDED</small>
          <h1 id="winner">战斗结束</h1>
          <button id="play-again" type="button">再次交锋</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
